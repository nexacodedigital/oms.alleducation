<!DOCTYPE html>
<html lang="id">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- PDF Libraries for Premium Reports -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

        tailwind.config = {
            theme: {
                extend: {
                    colors: { darkblue: '#0f172a', royalblue: '#2563eb', gold: '#f59e0b', background: '#f8fafc', surface: '#ffffff' },

                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #334155; overflow-x: hidden; touch-action: manipulation; }
        input, textarea, select { touch-action: manipulation; font-size: 16px !important; } 
        
        .glass-panel { background: #ffffff; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); border: 1px solid #f1f5f9; border-radius: 1.5rem; }
        .glass-card { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); border-radius: 1rem; transition: all 0.3s ease; }
        .glass-card:hover { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); transform: translateY(-2px); }
        
        .logo-spinner-img { animation: pulseBounce 1.5s infinite ease-in-out; }
        @keyframes pulseBounce { 0%, 100% { transform: scale(1) translateY(0); opacity: 1; } 50% { transform: scale(1.1) translateY(-10px); opacity: 0.8; } }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .sidebar-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(4px); z-index: 40; transition: opacity 0.3s; }
        
        .skeleton { background: #e2e8f0; background-image: linear-gradient(90deg, #e2e8f0 0px, #f1f5f9 40px, #e2e8f0 80px); background-size: 200vw 100%; animation: skeleton-loading 1.5s infinite linear; }
        @keyframes skeleton-loading { 0% { background-position: -100vw 0; } 100% { background-position: 100vw 0; } }
    </style>
</head>
<body class="bg-background min-h-screen relative selection:bg-royalblue selection:text-white">
    <div id="app" class="min-h-screen w-full relative">
        <div class="min-h-screen flex flex-col items-center justify-center bg-slate-50 absolute inset-0 z-50 transition-opacity duration-300" id="initial-loader">
            <div class="w-24 h-24 bg-white rounded-3xl shadow-xl flex items-center justify-center mb-6 border border-slate-100 p-3 relative overflow-hidden">
                <div class="absolute inset-0 bg-blue-50/50 animate-pulse"></div>
               <img src="https://iili.io/CMttawP.md.png" class="w-full h-full rounded-2xl logo-spinner-img relative z-10 object-contain p-1" id="initial-logo">
            </div>
            <h3 class="text-xl font-bold font-display text-darkblue mb-2">Memproses...</h3>
            <div class="text-slate-500 font-medium text-sm animate-pulse flex items-center gap-2"><i class="fas fa-circle-notch fa-spin text-royalblue"></i> Memuat Sistem...</div>
        </div>
    </div>

    <script>
        // KONFIGURASI APLIKASI
        // UBAH IS_PREVIEW KE false JIKA AKAN DI-DEPLOY KE BLOGGER
        const IS_PREVIEW = false; 
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxNnPpLA1C_RQQMQ0j2L-ESKzHYpmhCK5ptxiOW1zfr8QFEFW8ZBA5Z6O2j6zxQ1ElB/exec"; 
        
        const App = {
            state: {
                currentView: 'home', adminView: 'dashboard', tutorView: 'dashboard', user: null, sidebarOpen: window.innerWidth >= 768,
                dataLoaded: false, 
                filters: { tglMulai: '', tglAkhir: '', adminJadwalTgl: '', adminJadwalTutor: '', rincianTglMulai: '', rincianTglAkhir: '', rincianSiswa: '', payrollBln: '', payrollTut: '' }, 
                time: '', day: '', isSyncing: false,
                settings: { logo_url: 'https://iili.io/CMttawP.md.png', favicon_url: '', alur_recruitment: 'Submit CV, Screening HR, Interview Online, Micro Teaching, Hired' },
                db: { pengumuman: [], pelamar: [], tutor: [], siswa: [], jadwal: [], report: [], reimburse: [], tiket: [], layanan: [], rombel: [] },
                temp: { detailJadwalId: null, searchPelamar: '', searchTutor: '', searchSiswa: '', searchReport: '', tabPelamar: 'aktif', tabReimburse: 'aktif', tabTiket: 'aktif', tabJadwal: 'aktif', tabJadwalTut: 'aktif' }
            },

            formatTgl(tglRaw) { 
                if(!tglRaw) return '-'; 
                let dateStr = String(tglRaw);
                if(dateStr.includes('T')) dateStr = dateStr.split('T')[0];
                const parts = dateStr.split('-');
                if(parts.length === 3) {
                    const mNames = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Ags', 'Sep', 'Okt', 'Nov', 'Des'];
                    return `${parts[2]} ${mNames[parseInt(parts[1], 10)-1]} ${parts[0]}`;
                }
                return dateStr;
            },
            
            formatRp(angka) { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka || 0); },
            
            formatDateTime(isoString) { 
                if(!isoString) return '-'; 
                const d = new Date(isoString); 
                return `${d.getDate().toString().padStart(2,'0')} ${['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'][d.getMonth()]} ${d.getFullYear()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`; 
            },

            handleProfilePicUpload(e) {
                const file = e.target.files[0]; if(!file) return;
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image(); img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas'); const MAX_WIDTH = 300;
                        const scaleSize = MAX_WIDTH / img.width; canvas.width = MAX_WIDTH; canvas.height = img.height * scaleSize;
                        const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        const base64 = canvas.toDataURL('image/jpeg', 0.8);
                        document.getElementById('pf_foto_preview').src = base64;
                        document.getElementById('pf_foto_base64').value = base64;
                    }
                }
            },

            login(e) {
                e.preventDefault();
                const email = document.getElementById('loginEmail').value.trim();
                const password = document.getElementById('loginPassword').value.trim();
                this.performAPIAction('login', {email, password}, 'Login Berhasil').then(res => {
                    if(res && res.status === 'success') {
                        this.state.user = res.data;
                        localStorage.setItem('oms_session', JSON.stringify(res.data));
                        this.state.currentView = res.data.role;
                        this.render();
                    }
                });
            },

            logout() {
                Swal.fire({
                    title: 'Yakin ingin keluar?', text: "Sesi Anda akan diakhiri.", icon: 'warning', showCancelButton: true,
                    confirmButtonColor: '#2563eb', cancelButtonColor: '#cbd5e1', confirmButtonText: 'Ya, Logout!'
                }).then((result) => {
                    if (result.isConfirmed) {
                        localStorage.removeItem('oms_session');
                        localStorage.removeItem('oms_db_cache');
                        window.location.reload(true);
                    }
                });
            },

            forgotPassword() {
                Swal.fire({
                    title: 'Lupa Password?', text: 'Masukkan email akun Anda.', input: 'email', inputPlaceholder: 'Email Aktif',
                    showCancelButton: true, confirmButtonText: 'Kirim Email', confirmButtonColor: '#2563eb',
                    preConfirm: (email) => { if(!email) return Swal.showValidationMessage('Wajib diisi'); return email; }
                }).then((res) => {
                    if(res.isConfirmed) this.performAPIAction('forgotPassword', {email: res.value}, 'Email Kredensial Terkirim');
                });
            },

            submitRecruitment(e) {
                e.preventDefault();
                const payload = {
                    nama: document.getElementById('r_nama').value, email: document.getElementById('r_email').value, no_hp: document.getElementById('r_hp').value,
                    pendidikan: document.getElementById('r_pend').value, mapel: document.getElementById('r_mapel').value, portofolio: document.getElementById('r_porto').value, berkas: document.getElementById('r_berkas').value
                };
                this.performAPIAction('submitRecruitment', {data: payload}, 'Lamaran Berhasil Dikirim').then(res => {
                    if(res && res.status === 'success') { Swal.fire({icon: 'success', title: 'Berhasil!', text: 'Silakan cek menu Lacak Lamaran berkala.', confirmButtonColor: '#2563eb'}).then(() => this.navigate('home')); }
                });
            },

            trackLamaran() {
                const email = document.getElementById('t_email').value;
                if(!email) return Swal.fire('Error', 'Masukkan email valid', 'error');
                
                this.performAPIAction('trackLamaran', {email}, '', false).then(res => {
                    const box = document.getElementById('trackingResult'); box.classList.remove('hidden');
                    if(res && res.status === 'success') {
                        let histHtml = '';
                        try {
                            const hist = JSON.parse(res.history);
                            hist.forEach(h => { histHtml += `<div class="flex gap-4 mb-4"><div class="flex flex-col items-center"><div class="w-4 h-4 rounded-full bg-royalblue border-2 border-blue-200 mt-1"></div><div class="w-0.5 h-full bg-slate-200 my-1"></div></div><div><div class="text-sm font-bold text-darkblue">${h.status}</div><div class="text-xs text-slate-500">${this.formatDateTime(h.tgl)}</div></div></div>`; });
                        } catch(e){}
                        box.innerHTML = `<div class="bg-blue-50 p-5 rounded-xl border border-blue-100 mb-6 flex items-center justify-between"><div><h4 class="font-bold text-darkblue mb-1 text-sm">Status Saat Ini:</h4><div class="text-xl font-bold text-royalblue">${res.status_now}</div></div><i class="fas fa-check-circle text-4xl text-blue-200"></i></div><h4 class="font-bold text-slate-700 mb-4 border-b border-slate-200 pb-2">Timeline Riwayat</h4>${histHtml}`;
                    } else {
                        box.innerHTML = `<div class="bg-red-50 p-5 rounded-xl border border-red-100 text-red-600 text-center text-sm font-medium"><i class="fas fa-exclamation-triangle mr-2"></i> ${res?.message || 'Email tidak ditemukan.'}</div>`;
                    }
                });
            },

            exportRincianCSV() {
                let csv = "Tanggal,Siswa,Tutor,Layanan,Lokasi\n";
                const fMulai = this.state.filters.rincianTglMulai; const fAkhir = this.state.filters.rincianTglAkhir; const fSiswa = this.state.filters.rincianSiswa;
                
                const filtered = this.state.db.jadwal.filter(j => {
                    if (j.status !== 'Selesai') return false;
                    let jDate = j.tgl; if(String(jDate).includes('T')) jDate = String(jDate).split('T')[0];
                    if (fMulai && jDate < fMulai) return false;
                    if (fAkhir && jDate > fAkhir) return false;
                    if (fSiswa && j.siswa !== fSiswa) return false;
                    return true;
                });
                
                filtered.forEach(j => { csv += `"${this.formatTgl(j.tgl)}","${j.siswa.replace('ROMBEL - ', '')}","${j.nama_tutor}","${j.jenis_layanan}","${j.lokasi}"\n`; });
                const blob = new Blob([csv], { type: 'text/csv' }); const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a'); a.setAttribute('href', url); a.setAttribute('download', 'Laporan_Rincian_Sesi_Ortu.csv'); a.click();
            },

            exportTutorCSV() {
                let csv = "ID_Tutor,Nama,Email,No_HP,Bank,No_Rekening,Mapel,Status\n";
                this.state.db.tutor.forEach(t => { csv += `"${t.id}","${t.nama}","${t.email}","${t.no_hp||''}","${t.bank||''}","${t.no_rek||''}","${t.mapel}","${t.status}"\n`; });
                const blob = new Blob([csv], { type: 'text/csv' }); const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a'); a.setAttribute('href', url); a.setAttribute('download', 'Master_Data_Tutor_OMS.csv'); a.click();
            },

            downloadTemplateSiswa() {
                const csv = "Nama_Siswa,Jenjang,Layanan_Privat,Email_Kontak_Ortu\nSiswa Contoh,SD,Matematika SD,contoh@gmail.com\nSiswa Dua,SMP,Fisika,ortu2@gmail.com";
                const blob = new Blob([csv], { type: 'text/csv' }); const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a'); a.setAttribute('href', url); a.setAttribute('download', 'Template_Upload_Siswa.csv'); a.click();
            },

            cetakPDFReport(data) {
                const { jsPDF } = window.jspdf; const doc = new jsPDF('p', 'mm', 'a4');
                const pWidth = doc.internal.pageSize.getWidth();
                const pHeight = doc.internal.pageSize.getHeight();
                
                // Header Premium Biru Solid (Desain Referensi)
                doc.setFillColor(37, 99, 235); doc.rect(0, 0, pWidth, 35, 'F');
                doc.setFillColor(245, 158, 11); doc.rect(0, 35, pWidth, 4, 'F');
                
                doc.setTextColor(255, 255, 255); 
                doc.setFont("helvetica", "bold"); doc.setFontSize(22);
                doc.text("LAPORAN BELAJAR SISWA", pWidth/2, 20, { align: "center", charSpace: 1 });
                doc.setFontSize(10); doc.setFont("helvetica", "normal"); 
                doc.text("ALL EDUCATION INDONESIA", pWidth/2, 28, { align: "center", charSpace: 3 });
                
                // Watermark
                doc.setTextColor(240, 244, 248);
                doc.setFontSize(50); doc.setFont("helvetica", "bold");
                doc.text("ALL EDUCATION", pWidth/2, pHeight/2, { align: "center", angle: 45 });

                // Card Informasi Siswa
                doc.setFillColor(248, 250, 252); doc.roundedRect(15, 48, 180, 28, 4, 4, 'F');
                doc.setDrawColor(226, 232, 240); doc.roundedRect(15, 48, 180, 28, 4, 4, 'S');
                
                doc.setTextColor(51, 65, 85); doc.setFontSize(9); 
                doc.setFont("helvetica", "bold"); doc.text("Nama Siswa", 20, 58); doc.text(":", 45, 58); doc.text(`${String(data.nama_siswa).replace('ROMBEL - ', '').toUpperCase()}`, 48, 58);
                doc.text("Tanggal Sesi", 20, 68); doc.text(":", 45, 68); doc.text(`${this.formatTgl(data.tgl)}`, 48, 68);
                
                let layanan = "Privat"; try { if(data.id_jadwal) { const j = App.state.db.jadwal.find(x=>x.id===data.id_jadwal); if(j) layanan = j.jenis_layanan; } } catch(e){}
                doc.text("Tutor Pembimbing", 100, 58); doc.text(":", 130, 58); doc.text(`${String(data.nama_tutor).toUpperCase()}`, 133, 58);
                doc.text("Mata Pelajaran", 100, 68); doc.text(":", 130, 68); doc.text(`${layanan}`, 133, 68);

                let y = 88;
                const buatJudulSection = (teks, yPos) => {
                    doc.setFillColor(37, 99, 235); doc.rect(15, yPos, 180, 9, 'F');
                    doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(9);
                    doc.text(teks, 20, yPos + 6);
                };

                // Section 1: Materi
                buatJudulSection("1. MATERI YANG DIAJARKAN", y); y += 15;
                doc.setTextColor(51, 65, 85); doc.setFont("helvetica", "normal"); doc.setFontSize(9);
                const splitMateri = doc.splitTextToSize(data.materi || '-', 170); doc.text(splitMateri, 20, y);
                y += (splitMateri.length * 5) + 12;

                // Section 2: Evaluasi
                buatJudulSection("2. EVALUASI & PERKEMBANGAN", y); y += 15;
                doc.setFont("helvetica", "normal"); doc.setTextColor(51, 65, 85);
                
                // Progress Bar Visual
                doc.text("Pemahaman Materi", 20, y); 
                doc.setFillColor(226, 232, 240); doc.roundedRect(65, y-3, 50, 4, 2, 2, 'F');
                doc.setFillColor(37, 99, 235); doc.roundedRect(65, y-3, (data.pemahaman_star/5)*50, 4, 2, 2, 'F');
                doc.setFont("helvetica", "bold"); doc.text(`${data.pemahaman_star} / 5`, 120, y); doc.setFont("helvetica", "normal"); y+=8;
                
                doc.text("Kemandirian / Fokus", 20, y); 
                doc.setFillColor(226, 232, 240); doc.roundedRect(65, y-3, 50, 4, 2, 2, 'F');
                doc.setFillColor(16, 185, 129); doc.roundedRect(65, y-3, (data.kemandirian_star/5)*50, 4, 2, 2, 'F');
                doc.setFont("helvetica", "bold"); doc.text(`${data.kemandirian_star} / 5`, 120, y); doc.setFont("helvetica", "normal"); y+=10;
                
                doc.setFont("helvetica", "bold"); doc.text("Catatan Evaluasi / Hasil Hari Ini:", 20, y); y+=6;
                doc.setFont("helvetica", "normal");
                const splitHasil = doc.splitTextToSize(data.hasil_evaluasi || '-', 170); doc.text(splitHasil, 20, y);
                y += (splitHasil.length * 5) + 12;

                if (y > 230) { doc.addPage(); y = 20; }
                
                // Section 3: Target & Pesan
                buatJudulSection("3. TARGET & PESAN UNTUK ORTU", y); y += 9;
                doc.autoTable({
                    startY: y, margin: { left: 15 }, tableWidth: 180,
                    head: [['TARGET MINGGU DEPAN', 'PESAN UNTUK AYAH/BUNDA']],
                    body: [[ data.target || '-', data.pesan_ortu || '-' ]],
                    theme: 'grid', 
                    headStyles: { fillColor: [241, 245, 249], textColor: [51, 65, 85], fontStyle: 'bold', halign: 'center', fontSize: 8 },
                    styles: { fontSize: 9, textColor: [71, 85, 105], cellPadding: 6, valign: 'top' },
                    columnStyles: { 0: { cellWidth: 90 }, 1: { cellWidth: 90 } }
                });
                
                y = doc.lastAutoTable.finalY + 15;
                if (y > 250) { doc.addPage(); y = 20; }

                // Footer
                doc.setFillColor(37, 99, 235); doc.rect(0, pHeight - 12, pWidth, 12, 'F');
                doc.setTextColor(255, 255, 255); doc.setFontSize(8); doc.setFont("helvetica", "bold");
                doc.text("#pilihantepatuntukanakhebat #meningkatkanhasilmenggapaiimpian", pWidth/2, pHeight - 4, { align: "center" });

                doc.save(`Rapor_KBM_${data.nama_siswa}_${this.formatTgl(data.tgl)}.pdf`);
            },

            cetakPayslip(idTutor, bulan) {
                if(!idTutor || !bulan) return Swal.fire('Peringatan','Pilih bulan dan tutor terlebih dahulu.','warning');
                const tutor = App.state.db.tutor.find(t => t.id === idTutor);
                if(!tutor) return Swal.fire('Error','Tutor tidak ditemukan','error');
                
                const blnFilter = bulan.split('-')[1]; const thnFilter = bulan.split('-')[0];
                const riwayat = App.state.db.jadwal.filter(j => j.id_tutor === idTutor && j.status === 'Selesai' && String(j.tgl).startsWith(`${thnFilter}-${blnFilter}`));
                const reimburses = App.state.db.reimburse.filter(r => r.id_tutor === idTutor && r.status === 'Approved' && String(r.tgl).startsWith(`${thnFilter}-${blnFilter}`));
                
                if(riwayat.length === 0 && reimburses.length === 0) {
                    return Swal.fire('Data Kosong', 'Tidak ada data mengajar (Selesai) atau Reimburse di bulan ini. PDF ditolak.', 'error');
                }

                const { jsPDF } = window.jspdf; const doc = new jsPDF('p', 'mm', 'a4');
                
                // Header Premium Gelap
                doc.setFillColor(15, 23, 42); doc.rect(0, 0, 210, 40, 'F');
                doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(22);
                doc.text("SLIP PENDAPATAN TUTOR", 15, 18);
                doc.setFontSize(10); doc.setFont("helvetica", "normal"); doc.text("All Education Indonesia", 15, 26);
                
                doc.setFontSize(9); doc.text(`Periode: ${bulan}`, 195, 18, {align:"right"}); 
                doc.text(`Dicetak: ${this.formatTgl(new Date())}`, 195, 24, {align:"right"});
                doc.setFillColor(37, 99, 235); doc.roundedRect(165, 28, 30, 6, 1, 1, 'F');
                doc.setFont("helvetica", "bold"); doc.text("SUDAH DIBAYAR", 180, 32, {align:"center"});

                let y = 50;
                doc.setTextColor(15, 23, 42); doc.setFontSize(11);
                doc.setFont("helvetica", "bold"); doc.text("INFORMASI TUTOR", 15, y); y+=8;
                doc.setFontSize(9); doc.setFont("helvetica", "normal");
                
                doc.text("Nama Tutor", 15, y); doc.setFont("helvetica", "bold"); doc.text(`: ${tutor.nama}`, 45, y); doc.setFont("helvetica", "normal");
                doc.text("No. Rekening", 110, y); doc.setFont("helvetica", "bold"); doc.text(`: ${tutor.no_rek || '-'}`, 140, y); doc.setFont("helvetica", "normal"); y+=6;
                doc.text("Email", 15, y); doc.setFont("helvetica", "bold"); doc.text(`: ${tutor.email}`, 45, y); doc.setFont("helvetica", "normal");
                doc.text("Bank", 110, y); doc.setFont("helvetica", "bold"); doc.text(`: ${tutor.bank || '-'}`, 140, y); doc.setFont("helvetica", "normal"); y+=6;
                doc.text("No. HP", 15, y); doc.setFont("helvetica", "bold"); doc.text(`: ${tutor.no_hp || '-'}`, 45, y); doc.setFont("helvetica", "normal");

                y += 15;
                doc.setFontSize(11); doc.setFont("helvetica", "bold"); doc.text("RINGKASAN PENDAPATAN", 15, y); y+=8;
                
                let totHonor = 0, totTr = 0, totReimb = 0;
                const tableBody = riwayat.map((j, i) => {
                    totHonor += parseInt(j.fee||0); totTr += parseInt(j.transport||0);
                    return [i+1, this.formatTgl(j.tgl), j.jam, j.siswa.replace('ROMBEL - ', ''), j.jenis_layanan, this.formatRp(j.fee), this.formatRp(j.transport)];
                });
                reimburses.forEach(r => totReimb += parseInt(r.nominal||0));
                let totalAll = totHonor + totTr + totReimb;

                // Kartu Ringkasan
                const drawCard = (x, y, title, amount, subtitle, color, isAccent=false) => {
                    doc.setDrawColor(226, 232, 240);
                    if(isAccent) { doc.setFillColor(239, 246, 255); doc.roundedRect(x, y, 42, 22, 2, 2, 'FD'); } 
                    else { doc.setFillColor(255, 255, 255); doc.roundedRect(x, y, 42, 22, 2, 2, 'FD'); }
                    
                    doc.setFont("helvetica", "bold"); doc.setFontSize(7); doc.setTextColor(100, 116, 139);
                    doc.text(title, x+4, y+6);
                    doc.setFontSize(11); doc.setTextColor(color[0], color[1], color[2]);
                    doc.text(amount, x+4, y+13);
                    doc.setFontSize(7); doc.setTextColor(148, 163, 184); doc.setFont("helvetica", "normal");
                    doc.text(subtitle, x+4, y+19);
                };

                drawCard(15, y, "TOTAL MENGAJAR", this.formatRp(totHonor), `${riwayat.length} Sesi`, [15, 23, 42]);
                drawCard(60, y, "TRANSPORT", this.formatRp(totTr), `${riwayat.length} Sesi`, [15, 23, 42]);
                drawCard(105, y, "REIMBURSE", this.formatRp(totReimb), `${reimburses.length} Pengajuan`, [15, 23, 42]);
                drawCard(150, y, "TOTAL DITERIMA", this.formatRp(totalAll), "", [16, 185, 129], true);

                y += 32;
                doc.setFontSize(11); doc.setFont("helvetica", "bold"); doc.setTextColor(15, 23, 42); doc.text("DETAIL SESI MENGAJAR", 15, y); y+=4;

                doc.autoTable({
                    startY: y, headStyles: { fillColor: [37, 99, 235], textColor: 255, fontStyle: 'bold', halign: 'center' },
                    head: [['No', 'Tanggal', 'Jam', 'Siswa / Kelas', 'Program', 'Fee', 'Transport']],
                    body: tableBody, theme: 'grid', styles: {fontSize: 8, textColor: [71, 85, 105], lineColor: [226, 232, 240]},
                    columnStyles: { 5: {halign: 'right'}, 6: {halign: 'right'} }
                });

                let yFinal = doc.lastAutoTable.finalY + 15;
                doc.setFont("helvetica", "italic"); doc.setTextColor(148, 163, 184); doc.setFontSize(8);
                doc.text("Slip ini dibuat otomatis oleh OMS (Online Management System) All Education Indonesia.", 105, yFinal, {align:"center"});
                doc.text("Dicetak valid secara elektronik tanpa tanda tangan basah.", 105, yFinal+4, {align:"center"});

                doc.save(`Slip_Gaji_${tutor.nama}_${bulan}.pdf`);
            },

            init() {
                const savedSession = localStorage.getItem('oms_session');
                const savedDb = localStorage.getItem('oms_db_cache');
                
                if (savedSession) { 
                    this.state.user = JSON.parse(savedSession); 
                    this.state.currentView = this.state.user.role === 'admin' ? 'admin' : 'tutor'; 
                }
                
                if (savedDb) {
                    try { 
                        const parsed = JSON.parse(savedDb);
                        this.state.db = parsed.db || parsed; 
                        if(parsed.settings) this.state.settings = parsed.settings;
                        this.state.dataLoaded = true;
                    } catch(e){}
                }

                if (this.state.dataLoaded) { const loader = document.getElementById('initial-loader'); if(loader) loader.remove(); }
                this.render(); 
                
                setInterval(() => { const now = new Date(); const days = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu']; this.state.time = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')} WIB`; this.state.day = days[now.getDay()]; const clockEl = document.getElementById('rt-clock'); if(clockEl) clockEl.innerText = `${this.state.day}, ${this.state.time}`; }, 1000);
                
                let lastWidth = window.innerWidth;
                window.addEventListener('resize', () => { 
                    if(window.innerWidth !== lastWidth) { lastWidth = window.innerWidth; this.state.sidebarOpen = window.innerWidth >= 768; this.render(); }
                });
                
                this.fetchDataRealtime();

                // AUTO-SYNC REALTIME: Sinkronkan database setiap 10 detik di balik layar
                setInterval(() => {
                    if(!this.state.isSyncing) {
                        this.performAPIAction('getData', {}, '', true);
                    }
                }, 10000);
            },

                    });

                    const calendar = new FullCalendar.Calendar(calendarEl, {

            toggleSidebar() { this.state.sidebarOpen = !this.state.sidebarOpen; this.render(); },

            async performAPIAction(actionName, payload, successMsg, silent = false) {
                const blockingActions = ['login', 'trackLamaran', 'forgotPassword'];
                const isBlocking = blockingActions.includes(actionName);

                if (!silent && isBlocking) this.showLoader();
                
                this.state.isSyncing = true;
                const syncEl = document.getElementById('sync-badge-container');
                if(syncEl) syncEl.innerHTML = '<div class="text-xs font-bold text-royalblue bg-blue-50 px-3 py-1 rounded-full shadow-sm border border-blue-100 flex items-center gap-1"><i class="fas fa-sync fa-spin"></i> Menyimpan...</div>';
                
                try {
                    let shouldRenderOptimistic = false;
                    const d = new Date().toISOString();
                    
                    if(actionName === 'saveSiswa') {
                        if(payload.id) {
                            const s = this.state.db.siswa.find(x => x.id === payload.id);
                            if(s) { s.nama = payload.nama; s.jenjang = payload.jenjang; s.layanan = payload.layanan; s.kontak_ortu = payload.kontak; }
                        } else {
                            this.state.db.siswa.push({id: 'TEMP-'+Date.now(), nama: payload.nama, jenjang: payload.jenjang, layanan: payload.layanan, kontak_ortu: payload.kontak});
                        }
                        shouldRenderOptimistic = true;
                    }
                    else if(actionName === 'deleteSiswa') { this.state.db.siswa = this.state.db.siswa.filter(x => x.id !== payload.id); shouldRenderOptimistic = true; }
                    else if(actionName === 'deleteTutor') { this.state.db.tutor = this.state.db.tutor.filter(x => x.id !== payload.id); shouldRenderOptimistic = true; }
                    else if(actionName === 'updateStatusTutor') { const t = this.state.db.tutor.find(x => x.id === payload.id); if(t) t.status = payload.status; shouldRenderOptimistic = true; }
                    else if(actionName === 'saveSiswaMassal') {
                        payload.siswaArr.forEach(s => this.state.db.siswa.push({id: 'TEMP-'+Math.random(), nama: s.nama, jenjang: s.jenjang, layanan: s.layanan, kontak_ortu: s.kontak_ortu}));
                        shouldRenderOptimistic = true;
                    }
                    else if(actionName === 'submitReport') { 
                        const j = this.state.db.jadwal.find(x => x.id === payload.idJadwal); if(j) j.status = 'Selesai'; 
                        this.state.db.report.push({id: 'TEMP-'+Date.now(), tgl: d, id_jadwal: payload.idJadwal, id_tutor: payload.id_tutor, nama_tutor: payload.nama_tutor, nama_siswa: payload.nama_siswa, materi: payload.materi, pemahaman_star: payload.pemahaman_star, kemandirian_star: payload.kemandirian_star, hasil_evaluasi: payload.hasil_evaluasi, target: payload.target, pesan_ortu: payload.pesan_ortu, link_foto: payload.link_foto}); 
                        this.state.temp.detailJadwalId = null; 
                        shouldRenderOptimistic = true; 
                    }
                    else if(actionName === 'updateLamaran') { const l = this.state.db.pelamar.find(x => x.id === payload.id); if(l) l.status = payload.status; shouldRenderOptimistic = true; }
                    else if(actionName === 'accReimburse') { const r = this.state.db.reimburse.find(x => x.id === payload.id); if(r) r.status = 'Approved'; shouldRenderOptimistic = true; }
                    else if(actionName === 'updateProfil') { 
                        const t = this.state.db.tutor.find(x => x.id === payload.id_tutor); 
                        if(t) { t.no_hp = payload.no_hp; t.bank = payload.bank; t.no_rek = payload.no_rek; if(payload.foto) t.foto = payload.foto; } shouldRenderOptimistic = true; 
                    }
                    else if(actionName === 'bukaAksesReport') { const j = this.state.db.jadwal.find(x => x.id === payload.id); if(j) j.status = 'Buka Akses'; shouldRenderOptimistic = true; }
                    else if(actionName === 'rescheduleJadwal') { 
                        const j = this.state.db.jadwal.find(x => x.id === payload.id); 
                        if(j) { j.tgl = payload.tgl; j.jam = payload.jam; j.is_rescheduled = 1; j.alasan_reschedule = payload.alasan_reschedule; } 
                        this.state.temp.detailJadwalId = null; shouldRenderOptimistic = true; 
                    }
                    else if(actionName === 'ajukanCancel') {
                        const j = this.state.db.jadwal.find(x => x.id === payload.id);
                        if(j) j.status = 'Menunggu Cancel';
                        this.state.temp.detailJadwalId = null; shouldRenderOptimistic = true;
                    }
                    else if(actionName === 'approveCancel') { const j = this.state.db.jadwal.find(x => x.id === payload.id); if(j) j.status = 'Canceled'; shouldRenderOptimistic = true; }
                    else if(actionName === 'tolakCancel') { const j = this.state.db.jadwal.find(x => x.id === payload.id); if(j) j.status = 'Upcoming'; shouldRenderOptimistic = true; }
                    else if(actionName === 'generateJadwalMassal') {
                        const tData = payload.tutor.split('|'); let targetNama = payload.target.split('|')[1];
                        if(payload.target.startsWith('ROMBEL')) { targetNama = "ROMBEL - " + targetNama; }
                        payload.sesiArr.forEach((s, idx) => { this.state.db.jadwal.push({id: "TEMP-"+Date.now()+"-"+idx, tgl: s.tgl, jam: s.jam, id_tutor: tData[0], nama_tutor: tData[1], siswa: targetNama, jenis_layanan: payload.layanan, lokasi: payload.lokasi, zoom: payload.zoom, fee: payload.fee, transport: payload.tr, status: 'Upcoming', is_rescheduled: 0, alasan_reschedule: ''}); });
                        shouldRenderOptimistic = true;
                    }
                    else if(actionName === 'savePengumuman') { this.state.db.pengumuman.push({tanggal: d, judul: payload.judul, link_gambar: payload.img, isi: payload.isi}); shouldRenderOptimistic = true; }
                    else if(actionName === 'saveLayanan') { this.state.db.layanan.push({id: 'TEMP-'+Date.now(), nama: payload.nama}); shouldRenderOptimistic = true; }
                    else if(actionName === 'saveRombel') { this.state.db.rombel.push({id: 'TEMP-'+Date.now(), nama: payload.nama, siswa_arr: ''}); shouldRenderOptimistic = true; }
                    else if(actionName === 'submitReimburse') { this.state.db.reimburse.push({id: 'TEMP-'+Date.now(), tgl: payload.tgl, id_tutor: payload.id_tutor, nama_tutor: payload.nama_tutor, deskripsi: payload.deskripsi, nominal: payload.nominal, link_nota: payload.link_nota, status: 'Pending'}); shouldRenderOptimistic = true; }
                    else if(actionName === 'submitTiket') { this.state.db.tiket.push({id: 'TEMP-'+Date.now(), tgl: d, id_tutor: payload.id_tutor, nama_tutor: payload.nama_tutor, tipe: payload.tipe, deskripsi: payload.deskripsi, status: 'Open'}); shouldRenderOptimistic = true; }

                    else if(actionName === 'submitRecruitment') { this.state.db.pelamar.push({id: 'TEMP-'+Date.now(), tgl: d, nama: payload.data.nama, email: payload.data.email, no_hp: payload.data.no_hp, pendidikan: payload.data.pendidikan, mapel: payload.data.mapel, portofolio: payload.data.portofolio, berkas: payload.data.berkas, status: 'Screening CV', history_json: '[]'}); shouldRenderOptimistic = true; }
                    else if(actionName === 'deleteJadwal') { this.state.db.jadwal = this.state.db.jadwal.filter(x => x.id !== payload.id); shouldRenderOptimistic = true; }
                    else if(actionName === 'updateJadwal') { 
                        const j = this.state.db.jadwal.find(x => x.id === payload.id); 
                        if(j) { j.tgl = payload.tgl; j.jam = payload.jam; j.zoom = payload.zoom; j.fee = payload.fee; j.transport = payload.transport; }

                    }
                    else if(actionName === 'deletePengumuman') { this.state.db.pengumuman = this.state.db.pengumuman.filter(x => x.tanggal !== payload.id); shouldRenderOptimistic = true; }

                    }

                        if(!silent && successMsg) Swal.fire({ toast: true, position: 'top-end', showConfirmButton: false, timer: 2000, icon: 'success', title: successMsg });
                    }

            filterSelect(selectId, query) {
                const select = document.getElementById(selectId); if(!select) return;
                const filter = query.toLowerCase();
                for(let i=0; i<select.options.length; i++) {
                    const opt = select.options[i];
                    if(opt.text.toLowerCase().indexOf(filter) > -1 || opt.tagName === 'OPTGROUP') opt.style.display = '';
                    else opt.style.display = 'none';
                }
            },

            searchTable(query, tableId) {
                const filter = query.toLowerCase(); const table = document.getElementById(tableId); if(!table) return;
                const tr = table.getElementsByTagName("tr");
                for (let i = 1; i < tr.length; i++) {
                    const tdObj = tr[i].getElementsByTagName("td"); let match = false;
                    for (let j = 0; j < tdObj.length; j++) { if (tdObj[j] && tdObj[j].innerText.toLowerCase().indexOf(filter) > -1) { match = true; break; } }
                    tr[i].style.display = match ? "" : "none";
                }
            },

            wrap(title, icon, actionBtn, content) {
                return `<div class="glass-panel p-4 sm:p-6 mb-6 max-w-full"><div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 border-b border-slate-100 pb-4"><h3 class="text-lg font-bold text-darkblue flex items-center gap-3"><div class="w-8 h-8 rounded-lg bg-blue-50 flex items-center justify-center text-royalblue border border-blue-100 shrink-0"><i class="fas ${icon}"></i></div> <span class="truncate">${title}</span></h3>${actionBtn || ''}</div>${content}</div>`;
            },

            renderAdminContent(view) {
                const db = this.state.db;
                const d = new Date(); const localTodayDate = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');

                switch(view) {
                    case 'dashboard':
                        const kbmHariIni = db.jadwal.filter(j => String(j.tgl).split('T')[0] === localTodayDate && j.status !== 'Canceled');
                        let countBelumLengkap = 0;
                        db.jadwal.forEach(j => {
                            let jd = String(j.tgl).split('T')[0];
                            if(jd <= localTodayDate && j.status !== 'Selesai' && j.status !== 'Canceled' && j.status !== 'Menunggu Cancel') countBelumLengkap++;
                        });
                        
                        return `
                            <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">
                                <div class="glass-card p-5 border-l-4 border-l-royalblue"><span class="text-slate-500 text-xs font-bold mb-1 block uppercase">Tutor Aktif</span><span class="text-3xl font-bold text-darkblue font-display">${db.tutor.filter(t=>t.status==='Aktif').length}</span></div>

                                <div class="glass-card p-5 border-l-4 border-l-purple-500"><span class="text-slate-500 text-xs font-bold mb-1 block uppercase">Sesi KBM Selesai</span><span class="text-3xl font-bold text-darkblue font-display">${db.jadwal.filter(j=>j.status==='Selesai').length}</span></div>

                let rescheduleInfo = '';
                if(j.is_rescheduled == 1) {
                    rescheduleInfo = `<div class="bg-amber-50 border-l-4 border-amber-400 p-3 mb-4 rounded-r-lg text-xs text-amber-800 shadow-sm"><div class="font-bold mb-1"><i class="fas fa-info-circle"></i> Jadwal Telah Di-Reschedule</div><div><b>Alasan:</b> ${j.alasan_reschedule}</div></div>`;
                }
                
                let rescheduleBtn = '';
                let cancelBtn = '';
                if(!isSelesai && j.status !== 'Canceled' && j.status !== 'Menunggu Cancel' && this.state.user.role === 'tutor') {
                    if (j.is_rescheduled != 1) {
                        rescheduleBtn = `<button onclick="App.modalReschedule('${j.id}', '${jadwalDate}', '${j.jam}')" class="flex-1 bg-white border-2 border-slate-200 text-slate-600 font-bold py-2.5 rounded-xl hover:bg-slate-50 hover:border-slate-300 transition text-sm flex items-center justify-center gap-2 relative z-10 pointer-events-auto shadow-sm"><i class="fas fa-calendar-day"></i> Ajukan Reschedule (Maks 1x)</button>`;
                    }
                    cancelBtn = `<button onclick="App.modalCancelJadwal('${j.id}')" class="flex-1 bg-white border-2 border-red-100 text-red-500 font-bold py-2.5 rounded-xl hover:bg-red-50 hover:border-red-200 transition text-sm flex items-center justify-center gap-2 relative z-10 pointer-events-auto shadow-sm"><i class="fas fa-ban"></i> Ajukan Cancel</button>`;
                }

                return `
                    <div class="glass-panel p-4 sm:p-6 shadow-sm border border-slate-200">
                        <div class="flex items-center gap-3 sm:gap-4 mb-6 pb-4 border-b border-slate-100">
                            <button onclick="App.state.temp.detailJadwalId=null; App.render()" class="w-10 h-10 shrink-0 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center hover:bg-slate-200 transition pointer-events-auto"><i class="fas fa-arrow-left"></i></button>
                            <div class="overflow-hidden"><h3 class="font-bold text-lg sm:text-xl text-darkblue truncate">Session Info</h3><div class="flex flex-wrap items-center gap-2 mt-1"><span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider whitespace-nowrap ${isSelesai?'bg-emerald-100 text-emerald-700':j.status==='Buka Akses'?'bg-sky-100 text-sky-700': j.status==='Menunggu Cancel'?'bg-amber-100 text-amber-700' : j.status==='Canceled'?'bg-slate-200 text-slate-500':'bg-indigo-100 text-indigo-700'}">Status: ${j.status}</span> <span class="text-[10px] sm:text-xs text-slate-500 font-mono truncate">${j.id}</span></div></div>
                        </div>
                        <div class="bg-blue-50/50 rounded-xl border border-blue-100 p-4 sm:p-5 mb-8">
                            ${rescheduleInfo}
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-y-4 gap-x-6 text-sm text-slate-700">
                                <div class="flex flex-col"><div class="font-bold text-slate-500 text-xs uppercase mb-0.5">Jadwal & Jam</div><div class="break-words font-medium">${this.formatTgl(j.tgl)} (${j.jam})</div></div>
                                <div class="flex flex-col"><div class="font-bold text-slate-500 text-xs uppercase mb-0.5">Nama Siswa / Kelas</div><div class="font-bold break-words">${cleanSiswa}</div></div>
                                <div class="flex flex-col"><div class="font-bold text-slate-500 text-xs uppercase mb-0.5">Layanan</div><div class="break-words">${j.jenis_layanan}</div></div>
                                <div class="flex flex-col"><div class="font-bold text-slate-500 text-xs uppercase mb-0.5">Lokasi / Tipe</div><div class="break-words">${j.lokasi==='Offline'?'Tatap Muka Offline':`<a href="${j.zoom}" target="_blank" class="text-blue-500 underline pointer-events-auto font-bold"><i class="fas fa-video"></i> Buka Zoom</a>`}</div></div>
                                <div class="flex flex-col sm:col-span-2"><div class="font-bold text-slate-500 text-xs uppercase mb-0.5">Fee + Transport</div><div class="break-words font-mono font-bold text-emerald-600">${this.formatRp(j.fee)} + ${this.formatRp(j.transport)}</div></div>
                            </div>
                            ${(rescheduleBtn || cancelBtn) ? `<div class="flex flex-col sm:flex-row gap-3 mt-6 pt-4 border-t border-blue-100">${rescheduleBtn}${cancelBtn}</div>` : ''}
                        </div>
                        ${reportForm}
                    </div>
                `;
            },
            
            submitReportForm(e, idJadwal, namaSiswa) {
                e.preventDefault();
                const isRombel = namaSiswa.startsWith('ROMBEL - ');
                
                // Collect attendance if Rombel
                let absensiObj = {};
                if (isRombel) {
                    const selects = document.querySelectorAll('select[id^="absensi_rombel_"]');
                    if (selects.length === 0) return Swal.fire('Error', 'Tidak ada siswa di rombel ini.', 'error');
                    selects.forEach(sel => {
                        const sName = sel.getAttribute('data-nama');
                        absensiObj[sName] = sel.value;
                    });
                }

                const file = document.getElementById('rep_foto').files[0]; const reader = new FileReader();
                reader.onloadend = () => {
                    const img = new Image(); img.src = reader.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas'); const MAX_WIDTH = 600;
                        const scaleSize = MAX_WIDTH / img.width; canvas.width = MAX_WIDTH; canvas.height = img.height * scaleSize;
                        const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        const base64 = canvas.toDataURL('image/jpeg', 0.7);
                        const payload = {
                            idJadwal: idJadwal, id_tutor: this.state.user.id_tutor, nama_tutor: this.state.user.nama, nama_siswa: namaSiswa, 
                            materi: document.getElementById('rep_mat').value, pemahaman_star: document.getElementById('rep_p1').value, kemandirian_star: document.getElementById('rep_p2').value,
                            hasil_evaluasi: document.getElementById('rep_has').value, target: document.getElementById('rep_tar').value, pesan_ortu: document.getElementById('rep_pes').value,
                            link_foto: base64, absensi_json: JSON.stringify(absensiObj)
                        };
                        this.performAPIAction('submitReport', payload, isRombel ? 'Report & Absensi Kelas Terkirim ke Semua Ortu' : 'Report Sukses Terkirim & Ortu Diinfokan');
                    }
                };
                if(file) reader.readAsDataURL(file);
            },

           modalCancelJadwal(id) {
                const j = this.state.db.jadwal.find(x => x.id === id);
                let jDate = j.tgl; if(String(jDate).includes('T')) jDate = String(jDate).split('T')[0];
                
                Swal.fire({
                    title: 'Ajukan Cancel Jadwal',
                    html: `
                        <div class="text-left mt-2">
                            <div class="bg-red-50 p-3 rounded-lg text-xs text-red-700 mb-3 border border-red-100">
                                <i class="fas fa-exclamation-circle mr-1"></i> Pengajuan ini akan diteruskan ke HRD untuk di-review. Jadwal baru akan dihapus setelah di-approve.
                            </div>
                            <label class="text-xs font-bold text-slate-500 block mb-1">Alasan Pembatalan (Wajib)</label>
                            <textarea id="cancel_alasan" rows="3" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-red-400 pointer-events-auto" placeholder="Contoh: Sakit, ada keperluan mendadak..."></textarea>
                        </div>
                    `,
                    showCancelButton: true, confirmButtonText: 'Kirim Pengajuan Cancel', confirmButtonColor: '#ef4444',
                    preConfirm: () => {
                        const alasan = document.getElementById('cancel_alasan').value;
                        if(!alasan) return Swal.showValidationMessage('Alasan wajib diisi!');
                        
                        // Kirim data LENGKAP ke backend
                        this.performAPIAction('ajukanCancel', {
                            id: id,
                            id_jadwal: id,
                            tgl: jDate,
                            jam: j.jam,
                            id_tutor: j.id_tutor,
                            nama_tutor: j.nama_tutor,
                            siswa: j.siswa,
                            alasan: alasan
                        }, 'Pengajuan Cancel Terkirim ke HRD');
                    }
                });
            },
            modalReschedule(id, oldTgl, oldJam) {
                Swal.fire({
                    title: 'Reschedule Jadwal',
                    html: `<div class="text-left mt-2 flex flex-col gap-3"><div class="bg-blue-50 p-3 rounded-lg text-xs text-darkblue mb-2"><i class="fas fa-exclamation-triangle text-amber-500 mr-1"></i> Perhatian: Reschedule hanya dapat dilakukan <b>1 kali</b> per sesi.</div><div><label class="text-xs font-bold text-slate-500 block mb-1">Tanggal Baru</label><input type="date" id="resc_tgl" value="${oldTgl}" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-royalblue pointer-events-auto"></div><div><label class="text-xs font-bold text-slate-500 block mb-1">Jam Baru</label><input type="text" id="resc_jam" value="${oldJam}" placeholder="15:00-16:30" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-royalblue pointer-events-auto"></div><div><label class="text-xs font-bold text-slate-500 block mb-1">Alasan Reschedule</label><textarea id="resc_alasan" rows="3" placeholder="Contoh: Siswa ada kegiatan sekolah..." class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-royalblue pointer-events-auto"></textarea></div></div>`,
                    showCancelButton: true, confirmButtonText: 'Simpan Jadwal Baru', confirmButtonColor: '#2563eb',
                    preConfirm: () => {
                        const tgl = document.getElementById('resc_tgl').value; const jam = document.getElementById('resc_jam').value; const alasan = document.getElementById('resc_alasan').value;
                        if(!tgl || !jam || !alasan) return Swal.showValidationMessage('Semua kolom wajib diisi!');
                        this.performAPIAction('rescheduleJadwal', {id: id, tgl: tgl, jam: jam, alasan_reschedule: alasan}, 'Jadwal Berhasil Di-Reschedule');
                    }
                });
            },

            modalReimburse() {
                Swal.fire({ title: 'Form Reimburse', html: `<div class="flex flex-col gap-4 text-left mt-4"><div><label class="text-xs font-bold text-slate-500 mb-1 block">Tgl Keperluan</label><input type="date" id="rm_tgl" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-2.5 outline-none focus:border-royalblue pointer-events-auto"></div><div><label class="text-xs font-bold text-slate-500 mb-1 block">Deskripsi Pembelian</label><input type="text" id="rm_desc" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-2.5 outline-none focus:border-royalblue pointer-events-auto"></div><div><label class="text-xs font-bold text-slate-500 mb-1 block">Nominal (Rp)</label><input type="number" id="rm_nom" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-2.5 outline-none focus:border-royalblue pointer-events-auto"></div><div><label class="text-xs font-bold text-royalblue mb-1 block">Upload Foto Nota/Struk</label><input type="url" id="rm_file" placeholder="Link Gambar/Drive Akses Publik" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-2.5 outline-none focus:border-royalblue text-sm pointer-events-auto"></div></div>`, showCancelButton: true, confirmButtonText: 'Ajukan Reimburse', confirmButtonColor: '#2563eb', preConfirm: () => { this.performAPIAction('submitReimburse', { id_tutor: this.state.user.id_tutor, nama_tutor: this.state.user.nama, tgl: document.getElementById('rm_tgl').value, deskripsi: document.getElementById('rm_desc').value, nominal: document.getElementById('rm_nom').value, link_nota: document.getElementById('rm_file').value }, 'Reimburse Diajukan'); } });
            },

            modalJadwal() {
                const tutors = this.state.db.tutor.filter(t=>t.status==='Aktif').map(t => `<option value="${t.id}|${t.nama}">${t.nama} (${t.mapel})</option>`).join('');
                const layanans = this.state.db.layanan.map(l => `<option value="${l.nama}">${l.nama}</option>`).join('');
                const rombels = this.state.db.rombel.map(r => `<option value="ROMBEL|${r.nama}">${r.nama} (Kelas Besar)</option>`).join('');
                const siswas = this.state.db.siswa.map(s => `<option value="PRIVAT|${s.nama}">${s.nama} (Privat)</option>`).join('');

                Swal.fire({
                    title: 'Jadwal Auto-Generator', width: 650,
                    html: `
                        <div class="flex flex-col gap-4 text-left mt-2 max-h-[65vh] overflow-y-auto no-scrollbar p-1">
                            <div class="bg-blue-50 p-4 rounded-xl border border-blue-200 text-xs text-darkblue mb-2"><i class="fas fa-lightbulb text-gold mr-1"></i> Pilih tipe kelas, tentukan jumlah sesi dalam 1 bulan, dan sistem akan otomatis membuat kolom input tanggal sesuai jumlah sesi.</div>
                            
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div><label class="text-xs font-bold text-slate-500 block mb-1">Pilih Tutor</label><div class="relative"><i class="fas fa-search absolute left-2 top-2 text-slate-400 text-xs pointer-events-none"></i><input type="text" placeholder="Cari Tutor..." onkeyup="App.filterSelect('j_tut', this.value)" class="w-full mb-1 bg-slate-50 border border-slate-200 rounded pl-7 pr-2 py-1.5 text-xs outline-none relative z-10 pointer-events-auto"></div><select id="j_tut" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-royalblue relative z-10 pointer-events-auto">${tutors}</select></div>
                                <div><label class="text-xs font-bold text-slate-500 block mb-1">Target Peserta (Privat/Rombel)</label><div class="relative"><i class="fas fa-search absolute left-2 top-2 text-slate-400 text-xs pointer-events-none"></i><input type="text" placeholder="Cari Siswa/Rombel..." onkeyup="App.filterSelect('j_sis', this.value)" class="w-full mb-1 bg-slate-50 border border-slate-200 rounded pl-7 pr-2 py-1.5 text-xs outline-none relative z-10 pointer-events-auto"></div><select id="j_sis" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-royalblue relative z-10 pointer-events-auto"><optgroup label="Kelas Besar (Rombel)">${rombels}</optgroup><optgroup label="Kelas Privat (1 Siswa)">${siswas}</optgroup></select></div>
                                <div><label class="text-xs font-bold text-slate-500 block mb-1">Master Layanan (Mapel)</label><select id="j_lay" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-royalblue relative z-10 pointer-events-auto">${layanans}</select></div>
                                <div><label class="text-xs font-bold text-slate-500 block mb-1">Lokasi (Online/Offline)</label><select id="j_lok" onchange="document.getElementById('zoom_box').style.display = this.value==='Online'?'block':'none'" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-royalblue relative z-10 pointer-events-auto"><option value="Offline">Offline (Tatap Muka)</option><option value="Online">Online (Zoom/Meet)</option></select></div>
                            </div>
                            
                            <div id="zoom_box" style="display:none;"><label class="text-xs font-bold text-royalblue block mb-1">Link URL Zoom / GMeet</label><input type="url" id="j_zoom" class="w-full bg-blue-50 border border-blue-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-royalblue relative z-10 pointer-events-auto"></div>
                            
                            <div class="grid grid-cols-2 gap-4 pb-4 border-b border-slate-200">
                                <div><label class="text-xs font-bold text-slate-500 block mb-1">Fee Tutor (Rp)</label><input type="number" id="j_fee" value="75000" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-royalblue relative z-10 pointer-events-auto"></div>
                                <div><label class="text-xs font-bold text-slate-500 block mb-1">Transport (Rp)</label><input type="number" id="j_tr" value="15000" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-royalblue relative z-10 pointer-events-auto"></div>
                            </div>

                            <div class="flex items-center gap-4"><label class="text-sm font-bold text-darkblue">Jumlah Sesi :</label><input type="number" id="j_jml" min="1" max="12" value="1" onchange="App.renderSesiInputs(this.value)" class="w-20 bg-white border border-slate-300 rounded-lg px-3 py-2 text-center font-bold text-royalblue outline-none focus:ring-2 focus:ring-blue-100 transition relative z-10 pointer-events-auto"></div>
                            <div id="sesi_container" class="space-y-3 mt-2 bg-slate-50 p-4 rounded-xl border border-slate-200"></div>
                        </div>
                    `,
                    didOpen: () => App.renderSesiInputs(1), showCancelButton: true, confirmButtonText: 'Generate Jadwal Sesi', confirmButtonColor: '#2563eb',
                    preConfirm: () => {
                        const jml = parseInt(document.getElementById('j_jml').value);
                        const sesiData = [];
                        for(let i=1; i<=jml; i++) sesiData.push({ tgl: document.getElementById(`s_tgl_${i}`).value, jam: document.getElementById(`s_jam_${i}`).value });
                        return { tutor: document.getElementById('j_tut').value, target: document.getElementById('j_sis').value, layanan: document.getElementById('j_lay').value, lokasi: document.getElementById('j_lok').value, zoom: document.getElementById('j_zoom').value, fee: document.getElementById('j_fee').value, tr: document.getElementById('j_tr').value, sesiArr: sesiData };
                    }
                }).then((res) => { if(res.isConfirmed) this.performAPIAction('generateJadwalMassal', res.value, 'Jadwal Dibuat & Tutor Diinfokan via Email'); });
            },

            renderSesiInputs(jml) {
                const c = document.getElementById('sesi_container'); if(!c) return; let html = '';
                for(let i=1; i<=jml; i++) { html += `<div class="flex flex-col sm:flex-row gap-2 sm:gap-3 items-start sm:items-center"><div class="w-auto sm:w-20 text-[10px] sm:text-xs font-bold text-slate-500 uppercase tracking-wider">Sesi ${i} :</div><input type="date" id="s_tgl_${i}" required class="w-full sm:flex-1 bg-white border border-slate-300 rounded-lg px-3 py-1.5 text-sm outline-none focus:border-royalblue relative z-10 pointer-events-auto"><input type="text" id="s_jam_${i}" required placeholder="15:00-16:30" class="w-full sm:w-32 bg-white border border-slate-300 rounded-lg px-3 py-1.5 text-sm outline-none focus:border-royalblue relative z-10 pointer-events-auto"></div>`; }
                c.innerHTML = html;
            }
        };

        window.addEventListener('DOMContentLoaded', () => { App.init(); });
    </script>
</body>
</html>
